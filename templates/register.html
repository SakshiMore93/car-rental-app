{% extends 'base.html' %}

{%load static%}
<link rel="stylesheet" href="{%static 'style.css'%}">

{% block body %}

<section class="vh-100 bg-light">
  {% include 'messages.html' %}
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-xl-10">
        <div class="card shadow-lg rounded-3 text-black">
          <div class="row g-0">

            <!-- Image Column (Hidden on small screens) -->
           <div class="col-xl-6 d-none d-xl-block">
  {% load static %}
  <img src="{% static 'andre-masek-5qzYMtNx7Mc-unsplash.jpg' %}"
       alt="Sample photo"
       class="img-fluid"
       style="border-top-left-radius: .75rem;
              border-bottom-left-radius: .75rem;
              height: 100%;
              width: 100%;
              object-fit: cover;">
</div>


            <!-- Form Column -->
            <div class="col-xl-6">
              <div class="card-body p-5">

                <h3 class="mb-4 text-uppercase text-center">Sign Up</h3>

                <form method="post" action="\register">
                  {% csrf_token %}

                  <div class="form-group mb-3">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Full Name" name="name" required>
                  </div>

                  <div class="form-group mb-3">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Username" name="username" required>
                  </div>

                  <div class="form-group mb-3">
                    <label for="number">Phone Number</label>
                    <input type="tel" class="form-control" id="number" placeholder="Eg: 9120001478" name="number" required>
                  </div>

                  <div class="form-group mb-3">
                    <label for="email">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" required>
                    <small class="form-text text-muted">We'll never share your email with anyone else.</small>
                  </div>

                  <div class="form-group mb-3">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password" name="password" required>
                  </div>

                  <div class="form-group mb-4">
                    <label for="password2">Confirm Password</label>
                    <input type="password" class="form-control" id="password2" placeholder="Confirm Password" name="password2" required>
                  </div>

                  <div class="d-grid">
                    <button type="submit" class="btn btn-warning btn-sm">Submit</button>
                  </div>
                </form>

                <p class="text-center mt-3">Already have an account? 
                  <a href="/signin" class="text-primary">Login</a>
                </p>

              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>


{% endblock body %}
